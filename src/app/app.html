<h1 class="text-5xl font-bold flex justify-center mt-10">Directorio ({{userCount()}} usuarios)</h1>

<div class="flex justify-center gap-2">
  <app-controls (orderByIdClick)="orderById()" (orderByNameClick)="orderByName()" (reverse)="reverse()"></app-controls>
</div>

<div class="flex justify-center items-center">
  @if (users().length == 0){
    <h1>NO EXISTEN USUARIOS EN EL DIRECTORIO</h1>
  } @else {
    @for (user of users(); track user.id) {
      <app-user-card (idSender)="deleteUser($event)" [user]="user"></app-user-card>
    }
  }

</div>
