<div class="max-w-sm rounded-xl border border-neutral-200 bg-white p-6 shadow-sm flex flex-col items-center text-center">
  <img
    [src]="user().image"
    alt="Imagen de perfil"
    class="w-24 h-24 rounded-full object-cover mb-4 border border-neutral-100"
  >
  <h1 class="text-xl font-bold text-neutral-800">{{ user().name }}</h1>
  <p class="text-sm font-medium text-neutral-500 mb-1">&#64;{{ user().username }}</p>
  <p class="text-sm text-neutral-600">{{ user().email }}</p>

  <button (click)="deleteCard()" class="bg-red-500 text-white px-4 py-2 rounded">
    Eliminar
  </button>
</div>
